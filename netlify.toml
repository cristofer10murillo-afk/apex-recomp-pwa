[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[redirects]]
  from = "/assets/*.js"
  to = "/assets/apex-app.js"
  status = 200

[[redirects]]
  from = "/assets/*.css"
  to = "/assets/apex-asset.css"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
